services:
  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_USER: harbor_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-harbor-admin-local-only}
      POSTGRES_DB: postgres
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:-gateway-local-only}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth-local-only}
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:-accounts-local-only}
      TRANSFERS_DB_PASSWORD: ${TRANSFERS_DB_PASSWORD:-transfers-local-only}
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:-assistant-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbor_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: harbor_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-harbor-mongo-root-local}
      MONGO_INITDB_DATABASE: harbor_transactions
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-harbor-mongo-app-local}
    volumes:
      - mongo-data:/data/db
      - ./mongo/init-user.js:/docker-entrypoint-initdb.d/init-user.js:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  gateway:
    build: .
    command: ["uvicorn", "services.gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      PUBLIC_BASE_URL: http://localhost:8000
      DB_HOST: postgres
      DB_NAME: harbor_gateway
      DB_USER: harbor_gateway
      DB_PASSWORD: ${GATEWAY_DB_PASSWORD:-gateway-local-only}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-development-key}
      AUTH_SERVICE_URL: http://auth:8000
      ACCOUNTS_SERVICE_URL: http://accounts:8000
      TRANSFERS_SERVICE_URL: http://transfers:8000
      TRANSACTIONS_SERVICE_URL: http://transactions:8000
      ASSISTANT_SERVICE_URL: http://assistant:8000
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
      accounts:
        condition: service_healthy
      transfers:
        condition: service_healthy
      transactions:
        condition: service_healthy
      assistant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  auth:
    build: .
    command: ["uvicorn", "services.auth.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENV: development
      SEED_DEMO_DATA: "true"
      DB_HOST: postgres
      DB_NAME: harbor_auth
      DB_USER: harbor_auth
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth-local-only}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-development-key}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  accounts:
    build: .
    command: ["uvicorn", "services.accounts.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DB_HOST: postgres
      DB_NAME: harbor_accounts
      DB_USER: harbor_accounts
      DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:-accounts-local-only}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-development-key}
      AUTH_SERVICE_URL: http://auth:8000
      TRANSACTIONS_SERVICE_URL: http://transactions:8000
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
      transactions:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  transfers:
    build: .
    command: ["uvicorn", "services.transfers.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DB_HOST: postgres
      DB_NAME: harbor_transfers
      DB_USER: harbor_transfers
      DB_PASSWORD: ${TRANSFERS_DB_PASSWORD:-transfers-local-only}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-development-key}
      AUTH_SERVICE_URL: http://auth:8000
      ACCOUNTS_SERVICE_URL: http://accounts:8000
      TRANSACTIONS_SERVICE_URL: http://transactions:8000
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
      accounts:
        condition: service_healthy
      transactions:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  transactions:
    build: .
    command: ["uvicorn", "services.transactions.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-development-key}
      AUTH_SERVICE_URL: http://auth:8000
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DATABASE: harbor_transactions
      MONGO_USER: harbor_transactions
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD:-harbor-mongo-app-local}
    depends_on:
      mongo:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  assistant:
    build: .
    command: ["uvicorn", "services.assistant.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DB_HOST: postgres
      DB_NAME: harbor_assistant
      DB_USER: harbor_assistant
      DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:-assistant-local-only}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-development-key}
      AUTH_SERVICE_URL: http://auth:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  mongo-data:
