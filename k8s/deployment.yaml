apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: harbor-postgres
spec:
  serviceName: harbor-postgres
  replicas: 1
  selector:
    matchLabels:
      app: harbor-postgres
  template:
    metadata:
      labels:
        app: harbor-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: harbor-banking-postgres:latest
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: harbor_admin
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-banking-secrets
                  key: postgres-admin-password
            - name: GATEWAY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-banking-secrets
                  key: gateway-db-password
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-banking-secrets
                  key: auth-db-password
            - name: ACCOUNTS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-banking-secrets
                  key: accounts-db-password
            - name: TRANSFERS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-banking-secrets
                  key: transfers-db-password
            - name: ASSISTANT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-banking-secrets
                  key: assistant-db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "harbor_admin", "-d", "postgres"]
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "harbor_admin", "-d", "postgres"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-postgres
spec:
  selector:
    app: harbor-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-mongo-init
data:
  init-user.js: |
    db.createUser({
      user: "harbor_transactions",
      pwd: process.env.MONGO_APP_PASSWORD,
      roles: [{ role: "readWrite", db: "harbor_transactions" }],
    });
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: harbor-mongo
spec:
  serviceName: harbor-mongo
  replicas: 1
  selector:
    matchLabels:
      app: harbor-mongo
  template:
    metadata:
      labels:
        app: harbor-mongo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: harbor_admin
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-banking-secrets
                  key: mongo-root-password
            - name: MONGO_INITDB_DATABASE
              value: harbor_transactions
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-banking-secrets
                  key: mongo-app-password
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/init-user.js
              subPath: init-user.js
              readOnly: true
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mongosh --quiet --username "$MONGO_INITDB_ROOT_USERNAME" --password "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: init-script
          configMap:
            name: harbor-mongo-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-mongo
spec:
  selector:
    app: harbor-mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
