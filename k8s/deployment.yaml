apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: harbor-gateway
  template:
    metadata:
      labels:
        app: harbor-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: gateway
          image: harbor-banking:latest
          command: ["uvicorn", "services.gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PUBLIC_BASE_URL
              value: https://bank.example.com
            - name: AUTH_SERVICE_URL
              value: http://harbor-auth:8000
            - name: ACCOUNTS_SERVICE_URL
              value: http://harbor-accounts:8000
            - name: TRANSFERS_SERVICE_URL
              value: http://harbor-transfers:8000
            - name: TRANSACTIONS_SERVICE_URL
              value: http://harbor-transactions:8000
            - name: ASSISTANT_SERVICE_URL
              value: http://harbor-assistant:8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-gateway
spec:
  type: LoadBalancer
  selector:
    app: harbor-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harbor-auth
  template:
    metadata:
      labels:
        app: harbor-auth
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: auth
          image: harbor-banking:latest
          command: ["uvicorn", "services.auth.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENV
              value: production
            - name: SEED_DEMO_DATA
              value: "false"
            - name: DATA_DIR
              value: /data
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: harbor-banking-secrets
                  key: internal-api-key
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: harbor-auth-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: harbor-auth-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-auth
spec:
  selector:
    app: harbor-auth
  ports:
    - name: http
      port: 8000
      targetPort: http
---
