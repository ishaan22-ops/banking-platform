apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: harbor-gateway
  template:
    metadata:
      labels:
        app: harbor-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: gateway
          image: harbor-banking:latest
          command: ["uvicorn", "services.gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PUBLIC_BASE_URL
              value: https://bank.example.com
            - name: DB_HOST
              value: harbor-postgres
            - name: DB_NAME
              value: harbor_gateway
            - name: DB_USER
              value: harbor_gateway
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-banking-secrets
                  key: gateway-db-password
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: harbor-banking-secrets
                  key: internal-api-key
            - name: AUTH_SERVICE_URL
              value: http://harbor-auth:8000
            - name: ACCOUNTS_SERVICE_URL
              value: http://harbor-accounts:8000
            - name: TRANSFERS_SERVICE_URL
              value: http://harbor-transfers:8000
            - name: TRANSACTIONS_SERVICE_URL
              value: http://harbor-transactions:8000
            - name: ASSISTANT_SERVICE_URL
              value: http://harbor-assistant:8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-gateway
spec:
  type: LoadBalancer
  selector:
    app: harbor-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
